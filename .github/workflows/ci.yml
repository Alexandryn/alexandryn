name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for GITHUB_TOKEN: this workflow only reads the repository
# and passes artifacts between its own jobs. Declared here so any step needing
# more must declare it explicitly, and every job restates `contents: read`.
permissions:
  contents: read

# Cancel stale runs on the same PR to free runner capacity. Push to main
# is always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Frontend, backend, and desktop are split into separate jobs to allow each
# toolchain to use native caching actions and maintain legible test signals.
# - backend depends on frontend to embed web/dist in the server binary.
# - desktop depends on frontend and backend to test against the real server binary.


jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        # web/ is an npm workspace member (package.json at repo
        # root). Every `npm run` script below still resolves web/package.json
        # from here; only `npm ci` (below) must run at the workspace root.
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install
        working-directory: ${{ github.workspace }}
        run: npm ci

      # Verify generated design tokens match the committed files.
      - name: Design tokens up to date
        run: |
          npm run tokens:generate
          git diff --exit-code -- src/theme.css src/tokens.css src/breakpoints.ts

      - name: Design token contrast (WCAG AA)
        run: npm run tokens:check-contrast

      # Verify generated mock fixtures match the OpenAPI contract.
      - name: Mock fixtures up to date
        run: |
          npm run mocks:gen-fixtures
          git diff --exit-code -- src/mocks/fixtures/generated

      # Build web distribution assets embedded in the backend server binary.
      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Unit/component tests
        run: npm test

      - name: Storybook build
        run: npm run build-storybook

      # Ensure UI primitives use token-based CSS variables rather than raw values.
      - name: Token-only styling check
        run: npm run check:token-styling

      # Accessibility: ensure no positive tabindex disrupts natural focus order.
      - name: Accessibility — no positive tabindex
        run: npm run check:a11y-tabindex

      # Accessibility: ensure hidden text uses VisuallyHidden or sr-only styling.
      - name: Accessibility — no hand-rolled hidden text
        run: npm run check:a11y-hidden-text

      - name: Bundle-size check
        run: npm run check:bundle-size

      # Ensure all @radix-ui/* packages resolve to single versions to prevent code duplication.
      - name: Radix version-dedup check
        run: npm run check:radix-dedup

      - name: Production-bundle secrets check
        run: npm run check:dist-secrets

      - name: Production-bundle MSW-exclusion check
        run: npm run check:dist-msw

      - name: Dependency audit
        run: npm audit --audit-level=moderate

      # Install Playwright browser binaries and dependencies.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # End-to-end tests, axe-core accessibility checks, and cover rendering benchmarks.
      - name: Playwright — E2E, accessibility and cover benchmark
        run: npx playwright test

      # Upload trace and screenshot artifacts on failure for debugging.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-traces
          path: web/test-results
          retention-days: 7

      # Consumed only by this same run's backend/desktop jobs, within
      # minutes — not a human-facing download. The default 90-day
      # retention on artifacts like this one is what filled the repo's
      # artifact storage quota and started blocking every CI run;
      # 1 day is generous for a same-run handoff.
      - name: Upload web/dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    needs: frontend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Use a non-trivial password. This credential
          # is only reachable within the job's ephemeral network — it is
          # not a deployed secret — but a non-trivial password is
          # defence-in-depth against accidental exposure and consistent
          # with the principle of not normalising weak credentials in CI.
          POSTGRES_PASSWORD: ci-test-pg-alexandryn-s3cret
          POSTGRES_DB: alexandryn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download web/dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist

      # Embeds the real frontend into the binaries this job builds below —
      # without this, //go:embed keeps the committed placeholder and the
      # server never serves the real app (this is the bug releases 1.0.0
      # through 1.0.3 shipped with; see CHANGELOG.md 1.0.4).
      - name: Embed real web build
        run: bash scripts/embed-web-dist.sh

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # Stage 2 — go build ./cmd/server and ./cmd/pg-supervisor
      - name: Build
        run: go build ./...

      # Build real server binary for desktop lifecycle tests.
      - name: Build server binary for the desktop job
        run: |
          CGO_ENABLED=0 go build -o bin/alexandryn-server ./cmd/server
          # Record checksum to verify the desktop job executes the exact artifact built here.
          ( cd bin && sha256sum alexandryn-server > alexandryn-server.sha256 )

      # Regression guard for the 1.0.0–1.0.3 bug: actually run the binary
      # just built and assert it serves the real frontend at "/", not the
      # committed placeholder — a passing build/test suite never caught
      # that bug because nothing exercised this path end to end.
      - name: Smoke test - server serves the real frontend, not the placeholder
        env:
          OPEN_LIBRARY_USER_AGENT: "Alexandryn-CI/1.0 (+https://github.com/Alexandryn/alexandryn; static-handler smoke test)"
          DATABASE_URL: postgres://postgres:ci-test-pg-alexandryn-s3cret@localhost:5432/alexandryn_test?sslmode=disable
        run: |
          ./bin/alexandryn-server --config /dev/null > server.out 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          port=""
          for i in $(seq 1 20); do
            port="$(grep -o 'PORT=[0-9]*' server.out | head -1 | cut -d= -f2)"
            [ -n "$port" ] && break
            sleep 0.5
          done
          if [ -z "$port" ]; then
            echo "smoke test: server never announced a port" >&2
            cat server.out >&2
            exit 1
          fi
          body="$(curl -sf "http://127.0.0.1:$port/" 2>/dev/null)" || true
          if [ -z "${body:-}" ]; then
            echo "smoke test: server never answered on /" >&2
            exit 1
          fi
          if grep -q 'placeholder build' <<<"$body"; then
            echo "smoke test: server served the placeholder instead of the real frontend" >&2
            exit 1
          fi
          if ! grep -q 'id="root"' <<<"$body"; then
            echo "smoke test: served page doesn't look like the real web/dist build" >&2
            echo "$body" >&2
            exit 1
          fi
          echo "smoke test: real frontend served correctly"

      # Consumed only by this same run's desktop job, within minutes —
      # see the web/dist upload above for why this is 1 day, not the
      # 90-day default.
      - name: Upload server binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: server-binary
          path: |
            bin/alexandryn-server
            bin/alexandryn-server.sha256
          retention-days: 1

      - name: Vet
        run: go vet ./...

      # Dedicated guard script ensures gofmt formatting.
      - name: Formatter self-test
        run: CHECK_GOFMT_SELF_TEST=1 bash scripts/check-gofmt.sh

      - name: Formatter check
        run: bash scripts/check-gofmt.sh .

      - name: Import-boundary check self-test
        run: bash scripts/check-import-boundaries_test.sh

      - name: Import-boundary check
        run: bash scripts/check-import-boundaries.sh .

      - name: Parameterized-query check self-test
        run: bash scripts/check-parameterized-queries_test.sh

      - name: Parameterized-query check
        run: bash scripts/check-parameterized-queries.sh .

      - name: Compose published-port check self-test
        run: bash scripts/check-compose-published-port_test.sh

      - name: Compose published-port check
        run: bash scripts/check-compose-published-port.sh .

      - name: User-scoped-reading check self-test
        run: bash scripts/check-user-scoped-reading_test.sh

      - name: User-scoped-reading check
        run: bash scripts/check-user-scoped-reading.sh .

      - name: Release notes self-test
        run: bash scripts/release-notes_test.sh

      - name: Licence check self-test
        run: bash scripts/check-license_test.sh

      - name: Licence check
        run: bash scripts/check-license.sh .

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: golangci-lint
        run: golangci-lint run ./...

      # Run unit tests with race detector and generate coverage profile.
      - name: Unit tests
        run: go test -race -coverprofile=coverage.out ./...

      # Integration tests against PostgreSQL service container.
      # Each integration test creates and migrates its own isolated physical database.
      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-test-pg-alexandryn-s3cret@localhost:5432/alexandryn_test?sslmode=disable
        run: go test -race -tags=integration ./...

      # Contract tests: validate HTTP handlers against api/openapi.yaml schema.
      - name: Contract tests
        run: go test -race -v ./internal/testutil/contracttest/...

      # Coverage reporting with non-regression floor against scripts/coverage-baseline.txt.
      - name: Coverage summary
        run: go tool cover -func=coverage.out

      - name: Coverage floor self-test
        run: bash scripts/check-coverage_test.sh

      - name: Coverage floor
        run: bash scripts/check-coverage.sh .

      # Human-facing (debugging a coverage regression after the fact),
      # unlike web/dist and server-binary above, so this keeps a real
      # retention window rather than 1 day — 7 days matches the existing
      # playwright-traces convention in the frontend job above.
      - name: Upload coverage profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      # High-severity, high-confidence static security analysis.
      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -quiet -severity high -confidence high ./...

      # Container build and healthcheck target validation.
      # docker-compose.yml refuses to start without a database password, on
      # purpose, and interpolates it for every subcommand, so `down` needs it
      # too. This one exists only for this job's throwaway container.
      - name: Container-target test
        env:
          OPEN_LIBRARY_USER_AGENT: "Alexandryn-CI/1.0 (+https://github.com/Alexandryn/alexandryn; container-target test)"
          POSTGRES_PASSWORD: ci-container-test-alexandryn-s3cret
        timeout-minutes: 5
        run: docker compose --profile bundled-db up --build --wait --wait-timeout 120

      # The container test only says "unhealthy"; the backend's own log says why.
      - name: Container-target test logs
        if: failure()
        env:
          OPEN_LIBRARY_USER_AGENT: "Alexandryn-CI/1.0 (+https://github.com/Alexandryn/alexandryn; container-target test)"
          POSTGRES_PASSWORD: ci-container-test-alexandryn-s3cret
        run: |
          docker compose --profile bundled-db ps -a
          docker compose --profile bundled-db logs --no-color backend | tail -60

      - name: Container-target test teardown
        if: always()
        env:
          OPEN_LIBRARY_USER_AGENT: "Alexandryn-CI/1.0 (+https://github.com/Alexandryn/alexandryn; container-target test)"
          POSTGRES_PASSWORD: ci-container-test-alexandryn-s3cret
        run: docker compose --profile bundled-db down -v

  # Electron desktop host tests under virtual display server (xvfb).
  desktop:
    name: Desktop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Download server binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-binary
          path: bin

      # Verify server binary checksum before execution.
      - name: Verify server binary checksum
        working-directory: bin
        run: sha256sum --check alexandryn-server.sha256

      - name: Mark server binary executable
        run: chmod +x bin/alexandryn-server

      - name: Build
        run: npm run -w @alexandryn/desktop build

      # Verify boot tokens match frontend tokens without drift.
      - name: Boot tokens.css up to date
        run: git diff --exit-code -- electron/src/renderer/boot/tokens.css

      - name: Typecheck
        run: npm run -w @alexandryn/desktop typecheck

      - name: Lint
        run: npm run -w @alexandryn/desktop lint

      - name: Unit tests
        run: npm run -w @alexandryn/desktop test

      # Install xvfb display server for headless Electron execution on Linux.
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Playwright — _electron lifecycle
        run: xvfb-run -a npm run -w @alexandryn/desktop test:e2e
