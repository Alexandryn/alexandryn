name: CI

on:
  pull_request:
  push:
    branches: [main]

# backend-test-harness.md FR-8 fixes nine ordered stages for this
# workflow. All nine are real as of this workflow (phase 04): stage 1
# (web/ build, ADR 0008) runs in its own frontend job below; stage 6 is
# a named no-op (architecture-contracts.md FR-3's tool isn't chosen or
# built yet — a visible placeholder, not a silent gap); stage 9 is the
# real container-target test.
#
# frontend/backend/desktop are separate jobs (D2, tasks/plan-phase04.md;
# D5, tasks/plan-phase05.md), not one job with every toolchain's steps:
# each uses its own native GitHub Actions setup/cache action without
# cross-contaminating the others' install/cache surface, and each job's
# own red/green signal stays legible to a PR touching only one side.
# `backend` declares `needs: frontend` and downloads its `web/dist`
# artifact so the web-before-go-build ordering FR-8/ADR 0008 require is a
# real dependency between two CI jobs. `desktop` (phase 05) declares
# `needs: [frontend, backend]` — the workspace `npm ci` and a real
# server binary for the _electron lifecycle tests — and runs its
# Electron E2E behind xvfb (architecture-testing.md FR-2).

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        # web/ is an npm workspace member (ADR 0008, package.json at repo
        # root). Every `npm run` script below still resolves web/package.json
        # from here; only `npm ci` (below) must run at the workspace root.
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install
        working-directory: ${{ github.workspace }}
        run: npm ci

      # frontend-design-tokens.md FR-2: regenerate src/theme.css,
      # src/tokens.css and src/breakpoints.ts from .design-reference/*.dc.html,
      # then fail if that produces a diff — the committed files must always
      # match what the design reference actually says, never hand-edited or
      # left stale after a canvas update.
      - name: Design tokens up to date
        run: |
          npm run tokens:generate
          git diff --exit-code -- src/theme.css src/tokens.css src/breakpoints.ts

      - name: Design token contrast (WCAG AA)
        run: npm run tokens:check-contrast

      # frontend-shell-and-routing.md FR-6 tier (a): mock fixtures for
      # contract-covered endpoints are generated from api/openapi.yaml,
      # never hand-written — fail if the checked-in output is stale.
      - name: Mock fixtures up to date
        run: |
          npm run mocks:gen-fixtures
          git diff --exit-code -- src/mocks/fixtures/generated

      # Stage 1 — web/ build (ADR 0008, frontend-tooling.md FR-1/FR-6),
      # producing web/dist, the exact path/contract go:embed depends on.
      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      # No separate Typecheck step: npm run build (tsc -b && vite build,
      # above) already runs the identical tsc -b and blocks on it —
      # a second invocation here was pure redundancy, code review found.
      - name: Unit/component tests
        run: npm test

      - name: Storybook build
        run: npm run build-storybook

      # frontend-component-primitives.md FR-4/Acceptance criteria: no
      # primitive's source contains a raw hex/px value outside the token
      # set — interim grep-based check until a lint rule exists.
      - name: Token-only styling check
        run: npm run check:token-styling

      # frontend-accessibility.md FR-2 — no positive tabindex reorders
      # focus out of DOM order.
      - name: Accessibility — no positive tabindex
        run: npm run check:a11y-tabindex

      # frontend-accessibility.md FR-3 — screen-reader-only text uses
      # <VisuallyHidden> / sr-only, never display:none or a hand-rolled
      # clip-rect.
      - name: Accessibility — no hand-rolled hidden text
        run: npm run check:a11y-hidden-text

      - name: Bundle-size check
        run: npm run check:bundle-size

      - name: Production-bundle secrets check
        run: npm run check:dist-secrets

      - name: Production-bundle MSW-exclusion check
        run: npm run check:dist-msw

      - name: Dependency audit
        run: npm audit --audit-level=high

      # @playwright/test suites — a real CI dependency (D3,
      # tasks/plan-p04-tier3/-tier4), not the Playwright MCP (which is
      # interactive-only, not CI-capable). Two projects: `benchmark`
      # (frontend-generated-covers.md FR-4's cover timing) and `app`
      # (frontend-shell-and-routing.md's E2E walkthrough + reflow, plus
      # frontend-accessibility.md FR-4's real-browser @axe-core/playwright).
      # Placed after the checks above, not before: GitHub Actions stops a
      # job on first step failure, and the benchmark asserts tight
      # timing/frame-rate budgets on a shared runner — letting it run
      # first risked an intermittent, unrelated-looking slowdown here
      # silently skipping the secrets/MSW/audit checks for that run.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # One invocation, one worker (playwright.config.ts): the benchmark,
      # app and gallery projects never run concurrently, so the
      # benchmark's tight initial-paint budget isn't starved by another
      # browser. CI retries cover a transient slow cold-start frame
      # without weakening the budget.
      #
      # The `gallery` project is frontend-accessibility.md FR-4's
      # real-browser @axe-core/playwright scan of every primitive —
      # distinct from the lint step above (eslint-plugin-jsx-a11y,
      # write-time/structural) and from the per-primitive jsdom axe tests
      # in `npm test` (no layout engine). All three are required.
      - name: Playwright — E2E, accessibility and cover benchmark
        run: npx playwright test

      - name: Upload web/dist
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist

  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: frontend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alexandryn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Download web/dist
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Stage 2 — go build ./cmd/server and ./cmd/pg-supervisor
      # (architecture-testing.md FR-8).
      - name: Build
        run: go build ./...

      # The `desktop` job (phase 05) needs a real server binary at a
      # fixed path to spawn under @playwright/test's _electron harness
      # (desktop-host-process-model.md FR-1's dev path resolves
      # <root>/bin/alexandryn-server). Built here so the Electron E2E
      # runs against a genuine binary, not a stub.
      - name: Build server binary for the desktop job
        run: CGO_ENABLED=0 go build -o bin/alexandryn-server ./cmd/server

      - name: Upload server binary
        uses: actions/upload-artifact@v7
        with:
          name: server-binary
          path: bin/alexandryn-server

      # Stage 3 — go vet and lint, including the import-boundary check
      # (architecture-backend.md FR-3, FR-7; ADR 0018).
      - name: Vet
        run: go vet ./...

      - name: Import-boundary check self-test
        run: bash scripts/check-import-boundaries_test.sh

      - name: Import-boundary check
        run: bash scripts/check-import-boundaries.sh .

      - name: Parameterized-query check self-test
        run: bash scripts/check-parameterized-queries_test.sh

      - name: Parameterized-query check
        run: bash scripts/check-parameterized-queries.sh .

      - name: Compose published-port check self-test
        run: bash scripts/check-compose-published-port_test.sh

      - name: Compose published-port check
        run: bash scripts/check-compose-published-port.sh .

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: golangci-lint
        run: golangci-lint run ./...

      # Stage 4 — unit tests, race detector (FR-1, FR-9). No build tag:
      # must never require PostgreSQL, Docker, or any external service.
      # Produces the coverage profile stage 7 reports below, rather than
      # running the suite twice.
      - name: Unit tests
        run: go test -race -coverprofile=coverage.out ./...

      # Stage 5 — integration tests, against the Postgres service
      # container above (architecture-testing.md FR-3: never the
      # application's own bundled-spawn mechanism for this fast, per-PR
      # suite). TEST_DATABASE_URL points at the service by its Docker
      # network alias, port 5432 in-network regardless of the mapped
      # host port above.
      #
      # Default package-level parallelism is safe here: each
      # integration-tagged package's own TestMain (internal/testutil,
      # internal/persistence/postgres, cmd/server) now creates and
      # migrates its own physical database, derived from
      # TEST_DATABASE_URL via testutil.EnsurePackageDatabase
      # (backend-test-harness.md FR-3 Variant B, T26) — no two packages'
      # DDL touches the same database any more, closing the collision
      # that previously forced -p 1 (two concurrent CREATE TABLE
      # statements colliding on Postgres's own pg_type catalog,
      # confirmed for real during T24's R3).
      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/alexandryn_test?sslmode=disable
        run: go test -race -tags=integration ./...

      # Stage 6 — contract test, named no-op (D3, tasks/plan.md).
      # architecture-contracts.md FR-3's own tool (schema validation
      # against real responses, or generated-server-stub conformance)
      # isn't chosen or built yet — this step exists so the stage is
      # present and visible, not silently skipped, until it is.
      - name: Contract test (not yet implemented)
        run: |
          echo "Contract test stage is a placeholder: architecture-contracts.md FR-3's tool isn't chosen yet (D3, tasks/plan.md)."
          echo "This step exists so the stage is visible in CI, not silently absent — see backend-test-harness.md FR-8."

      # Stage 7 — coverage reporting. No tool or threshold is fixed yet
      # (open question); this only proves the stage exists and its
      # output is captured.
      - name: Coverage summary
        run: go tool cover -func=coverage.out

      - name: Upload coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

      # Stage 8 — dependency vulnerability scan (architecture-testing.md
      # FR-5).
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      # Stage 9 — container-target test (deployment-container-packaging.md
      # FR-10, ADR 0015). Runs in this same job rather than a separate
      # one, per FR-10's own text ("no platform-specific spawn/orphan-
      # prevention mechanism to exercise... fast and platform-
      # independent"). docker-compose.yml's bundled-db profile builds
      # the Dockerfile image and brings up backend + postgres; --wait
      # blocks on Compose's own health status (backend's HEALTHCHECK,
      # FR-3) rather than any test runner reaching over the network.
      # OPEN_LIBRARY_USER_AGENT has no default by design
      # (backend-configuration.md FR-3) — this is CI's own honest,
      # explicit value for this run, not a placeholder pretending to be
      # a real deployment (deployment-container-packaging.md's own
      # 2026-08-25 amendment).
      - name: Container-target test
        env:
          OPEN_LIBRARY_USER_AGENT: "Alexandryn-CI/1.0 (+https://github.com/Alexandryn/alexandryn; container-target test)"
        # --wait-timeout and timeout-minutes both bound this: without
        # them, a genuine healthcheck regression (backend or postgres
        # never turning healthy) hangs here until GitHub's default
        # 6-hour job timeout instead of failing fast like every other
        # step in this job.
        timeout-minutes: 5
        run: docker compose --profile bundled-db up --build --wait --wait-timeout 120

      - name: Container-target test teardown
        if: always()
        run: docker compose --profile bundled-db down -v

  # Phase 05 — the Electron desktop host. architecture-testing.md FR-2:
  # @playwright/test's own `_electron` support, on a Linux runner behind a
  # virtual display server (xvfb, D5). Needs `frontend` for the workspace
  # `npm ci` and `backend` for a real server binary the lifecycle tests
  # spawn (Tier 1+).
  desktop:
    name: Desktop
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Download server binary
        uses: actions/download-artifact@v8
        with:
          name: server-binary
          path: bin

      - name: Mark server binary executable
        run: chmod +x bin/alexandryn-server

      - name: Build
        run: npm run -w @alexandryn/desktop build

      - name: Typecheck
        run: npm run -w @alexandryn/desktop typecheck

      - name: Lint
        run: npm run -w @alexandryn/desktop lint

      - name: Unit tests
        run: npm run -w @alexandryn/desktop test

      # Electron is a GUI app and needs a display to launch at all on
      # Linux, window shown or not (architecture-testing.md FR-2).
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Playwright — _electron lifecycle
        run: xvfb-run -a npm run -w @alexandryn/desktop test:e2e
