# Compose configuration for Alexandryn:
# - backend: always active
# - postgres: optional local database active only under --profile bundled-db.
#
# backend's depends_on uses `required: false` so that running backend
# against an external DATABASE_URL without the bundled-db profile does not
# fail on an undefined service dependency.
services:
  backend:
    build: .
    environment:
      - BIND_ADDRESS=127.0.0.1:8080
      # If your own .env sets DATABASE_URL, that value takes precedence.
      # Unset it in your shell or comment it out in .env before using the
      # bundled-db profile, or backend will connect to your host-side database
      # instead of the bundled container instance.
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin}@postgres:5432/${POSTGRES_DB:-alexandryn}?sslmode=disable}
      # Required by Open Library's API policy. Must be set in .env.
      - OPEN_LIBRARY_USER_AGENT
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    # Loopback binding by default; no exposed ports or host networking on default profile.

  postgres:
    image: postgres:16-alpine
    profiles: ["bundled-db"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-alexandryn}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-alexandryn}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
