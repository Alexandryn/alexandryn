# NGINX reverse proxy configuration for Alexandryn
# Routes frontend and API traffic to the internal Go backend on port 8080.
# Keeps internal service ports (backend and PostgreSQL) private on the Docker bridge network.

server {
    listen 80;
    listen [::]:80;
    server_name alexandryn.local localhost "";

    # Enforce request limits matching backend configuration (10 MB max body)
    client_max_body_size 10M;

    # Timeouts aligned with backend HTTP timeouts
    proxy_connect_timeout 15s;
    proxy_send_timeout 15s;
    proxy_read_timeout 60s;

    # Pass client identification headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket / SSE connection upgrade support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;

    # Health and readiness probes
    location = /healthz {
        proxy_pass http://backend:8080/healthz;
    }

    location = /readyz {
        proxy_pass http://backend:8080/readyz;
    }

    # API endpoints
    location /api/ {
        proxy_pass http://backend:8080;
    }

    # Static assets and SPA routing fallback
    location / {
        proxy_pass http://backend:8080;
    }
}
